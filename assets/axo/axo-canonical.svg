<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="Axo  Dozeify mascot axolotl">
  <title>Axo  canonical</title>
  <desc>Minimalist 2D line-art axolotl mascot. Pastel pink fill, black dot eyes, tiny w mouth.</desc>

  <!-- Brand colors (see docs/axo-character-sheet.md) -->
  <defs>
    <style>
      .axo-fill { fill: #FAD4D8; }
      .axo-stroke { fill: none; stroke: #1A1A1A; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .axo-eye { fill: #1A1A1A; }
    </style>
  </defs>

  <!-- Tail (behind body) -->
  <path class="axo-fill axo-stroke" d="M 248 340
    C 310 360, 330 420, 300 470
    C 285 495, 255 500, 235 478
    C 218 460, 225 430, 248 400
    Z"/>

  <!-- Body -->
  <ellipse class="axo-fill axo-stroke" cx="200" cy="310" rx="95" ry="110"/>

  <!-- Head -->
  <ellipse class="axo-fill axo-stroke" cx="200" cy="175" rx="105" ry="95"/>

  <!-- Left gills -->
  <path class="axo-stroke" d="M 108 155 C 72 145, 58 165, 62 185"/>
  <path class="axo-stroke" d="M 102 175 C 66 172, 52 192, 58 212"/>
  <path class="axo-stroke" d="M 108 198 C 74 205, 64 228, 72 248"/>

  <!-- Right gills -->
  <path class="axo-stroke" d="M 292 155 C 328 145, 342 165, 338 185"/>
  <path class="axo-stroke" d="M 298 175 C 334 172, 348 192, 342 212"/>
  <path class="axo-stroke" d="M 292 198 C 326 205, 336 228, 328 248"/>

  <!-- Legs -->
  <path class="axo-fill axo-stroke" d="M 155 395 L 145 455 Q 143 472 158 472 Q 173 472 171 455 L 168 395 Z"/>
  <path class="axo-fill axo-stroke" d="M 245 395 L 255 455 Q 257 472 242 472 Q 227 472 229 455 L 232 395 Z"/>

  <!-- Arms (relaxed at sides) -->
  <path class="axo-fill axo-stroke" d="M 108 285 L 78 320 Q 68 332 76 342 Q 84 352 96 340 L 118 300 Z"/>
  <path class="axo-fill axo-stroke" d="M 292 285 L 322 320 Q 332 332 324 342 Q 316 352 304 340 L 282 300 Z"/>

  <!-- Dot eyes (" ")  do not change radius or spacing without brand approval -->
  <circle class="axo-eye" cx="168" cy="168" r="7"/>
  <circle class="axo-eye" cx="232" cy="168" r="7"/>

  <!-- Tiny w mouth -->
  <path class="axo-stroke" stroke-width="5" d="M 182 198 Q 188 206 194 198 Q 200 206 206 198 Q 212 206 218 198"/>
</svg>
