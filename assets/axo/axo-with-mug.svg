      .axo-eye { fill: #1A1A1A; }
      .prop-fill { fill: #FFFFFF; }
      .prop-stroke { fill: none; stroke: #1A1A1A; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .steam { fill: none; stroke: #1A1A1A; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <path class="axo-fill axo-stroke" d="M 248 340 C 310 360, 330 420, 300 470 C 285 495, 255 500, 235 478 C 218 460, 225 430, 248 400 Z"/>
  <ellipse class="axo-fill axo-stroke" cx="200" cy="318" rx="88" ry="102"/>
  <ellipse class="axo-fill axo-stroke" cx="200" cy="172" rx="102" ry="92"/>

  <path class="axo-stroke" d="M 110 152 C 76 142, 62 162, 66 182"/>
  <path class="axo-stroke" d="M 104 172 C 70 168, 56 188, 62 208"/>
  <path class="axo-stroke" d="M 110 195 C 76 202, 66 224, 74 244"/>
  <path class="axo-stroke" d="M 290 152 C 324 142, 338 162, 334 182"/>
  <path class="axo-stroke" d="M 296 172 C 330 168, 344 188, 338 208"/>
  <path class="axo-stroke" d="M 290 195 C 324 202, 334 224, 326 244"/>

