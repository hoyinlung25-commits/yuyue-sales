<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="Axo holding a mug">
  <title>Axo  with mug</title>
  <defs>
    <style>
      .axo-fill { fill: #E4D4EA; }
