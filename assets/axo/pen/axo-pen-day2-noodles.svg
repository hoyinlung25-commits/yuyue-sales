<?xml version="1.0" encoding="UTF-8"?>
<!-- Day 2: noodles shock  same color tokens as canonical -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" role="img" aria-label="Axo Day 2 noodles shock">
  <title>Axo  Day 2 giant noodles</title>
  <defs>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.93  0 0 0 0 0.86  0 0 0 0.04 0" in="noise" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <style>
      .paper { fill: #F2EBD9; }
      .wash { fill: #E8D8E8; opacity: 0.55; }
      .table { fill: #EDE6D6; }
      .bowl { fill: #FAF6EE; }
      .noodle { fill: none; stroke: #C4A574; stroke-width: 2; stroke-linecap: round; }
      .ink { fill: none; stroke: #2A2420; stroke-linecap: round; stroke-linejoin: round; }
      .ink-main { stroke-width: 2.8; }
      .ink-light { stroke-width: 1.6; }
      .eye { fill: #2A2420; }
      .sweat { fill: none; stroke: #2A2420; stroke-width: 1.8; opacity: 0.55; }
    </style>
  </defs>

  <g filter="url(#paperGrain)">
    <rect class="paper" width="400" height="640"/>

    <!-- Small table -->
    <rect class="table ink ink-main" x="218" y="360" width="120" height="10" rx="2"/>
    <path class="ink ink-main" d="M 228 370 L 224 420 M 328 370 L 332 420"/>

    <!-- Giant noodle bowl -->
    <ellipse class="bowl ink ink-main" cx="278" cy="330" rx="75" ry="28"/>
    <path class="ink ink-main" d="M 203 330 Q 203 380 278 395 Q 353 380 353 330"/>
    <path class="noodle" d="M 240 318 Q 260 300 278 312 Q 296 324 316 308"/>
    <path class="noodle" d="M 232 328 Q 255 340 278 322 Q 301 304 324 318"/>
    <path class="noodle" d="M 248 335 Q 268 325 288 338 Q 308 351 328 330"/>
    <path class="ink ink-light" d="M 268 288 Q 278 268 290 282"/>
    <path class="ink ink-light" d="M 282 285 Q 292 270 302 278"/>

    <!-- Axo (left of table, looking down at bowl) -->
    <g transform="translate(-20, 80)">
      <path class="wash ink ink-main" d="M 198 338 C 240 348, 252 388, 232 422 C 220 438, 198 442, 186 428 C 174 414, 178 392, 196 374 Z"/>
      <ellipse class="wash" cx="168" cy="318" rx="68" ry="80"/>
      <ellipse class="ink ink-main" cx="168" cy="318" rx="68" ry="80"/>
      <ellipse class="wash" cx="175" cy="178" rx="78" ry="70"/>
      <ellipse class="ink ink-main" cx="175" cy="178" rx="78" ry="70"/>

      <!-- Gills standing straight up (shock) -->
      <path class="ink ink-main" d="M 108 155 L 98 118"/>
      <path class="ink ink-main" d="M 118 158 L 112 120"/>
      <path class="ink ink-main" d="M 128 162 L 126 122"/>
      <path class="ink ink-main" d="M 238 155 L 248 118"/>
      <path class="ink ink-main" d="M 228 158 L 234 120"/>
      <path class="ink ink-main" d="M 218 162 L 220 122"/>

      <path class="wash ink ink-main" d="M 142 398 L 134 452 Q 132 464 144 464 Q 156 464 154 450 L 152 398 Z"/>
      <path class="wash ink ink-main" d="M 194 398 L 202 452 Q 204 464 192 464 Q 180 464 182 450 L 184 398 Z"/>

      <path class="wash ink ink-main" d="M 118 288 L 100 318 Q 94 328 102 334 Q 110 340 120 330 L 128 298 Z"/>
      <path class="wash ink ink-main" d="M 218 288 L 200 312 Q 194 320 202 324 Q 210 328 216 318 L 212 298 Z"/>

      <!-- LOCKED FACE (looking down — same dots + flat mouth) -->
      <circle class="eye" cx="152" cy="186" r="2.5"/>
      <circle class="eye" cx="198" cy="192" r="2.5"/>
      <path class="ink ink-main" stroke-width="2.2" d="M 164 208 Q 169 214 174 208 Q 179 214 184 208"/>

      <!-- Sweat -->
      <path class="sweat" d="M 138 168 Q 134 178 138 186"/>
      <path class="sweat" d="M 208 172 Q 212 182 208 190"/>
      <path class="sweat" d="M 148 148 Q 144 156 148 162"/>
      <path class="sweat" d="M 198 152 Q 202 160 198 166"/>
    </g>
  </g>
</svg>
