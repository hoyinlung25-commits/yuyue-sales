<?xml version="1.0" encoding="UTF-8"?>
<!-- Slide 2: 1:1 body ref prone sleep, Zzz, English text -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <title>Day 2 Slide 2 - Thing 1 Nap</title>
  <defs>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.93  0 0 0 0 0.86  0 0 0 0.04 0" in="noise" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <style>
      .paper { fill: #F2EBD9; }
      .wash { fill: #E8D8E8; opacity: 0.55; }
      .ink { fill: none; stroke: #2A2420; stroke-linecap: round; stroke-linejoin: round; }
      .ink-main { stroke-width: 2.8; }
      .ink-thin { stroke-width: 1.6; }
      .eye { fill: #2A2420; }
    </style>
  </defs>
  <g filter="url(#paperGrain)">
    <rect class="paper" width="400" height="640"/>
    <text x="200" y="80" text-anchor="middle" font-family="cursive" font-size="26" font-weight="600" fill="#2A2420">Thing 1: Nap.</text>
    <text x="175" y="148" font-family="cursive" font-size="28" font-weight="bold" fill="#2A2420">Z</text>
    <text x="198" y="126" font-family="cursive" font-size="22" font-weight="bold" fill="#2A2420">z</text>
    <text x="215" y="108" font-family="cursive" font-size="16" font-weight="bold" fill="#2A2420">z</text>
    <!-- Body layout note: match reference axo-pen-day1 prone 1:1 in PNG -->
  </g>
</svg>
