      <path class="ink ink-light" d="M 248 208 L 272 218"/>
      <path class="ink ink-light" d="M 128 242 L 126 256 M 126 256 L 122 258 M 126 256 L 130 258"/>
      <path class="ink ink-light" d="M 210 240 L 214 254"/>
