<?xml version="1.0" encoding="UTF-8"?>
<!-- Slide 2: prone nap, thin baby limbs per brand reference, Zzz no cloud -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <title>Day 2 Slide 2</title>
  <defs>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.93  0 0 0 0 0.86  0 0 0 0.04 0" in="noise" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <style>
      .paper { fill: #F2EBD9; }
      .wash { fill: #E8D8E8; opacity: 0.55; }
      .ink { fill: none; stroke: #2A2420; stroke-linecap: round; stroke-linejoin: round; }
      .ink-main { stroke-width: 2.8; }
      .ink-thin { stroke-width: 1.8; }
      .eye { fill: #2A2420; }
      .cup { fill: #FAF6EE; }
    </style>
  </defs>
  <g filter="url(#paperGrain)">
    <rect class="paper" width="400" height="640"/>
    <text x="200" y="72" text-anchor="middle" font-family="PingFang TC, cursive" font-size="22" font-weight="600" fill="#2A2420">第一件事：睡午覺。</text>
    <text x="175" y="150" font-family="cursive" font-size="28" font-weight="bold" fill="#2A2420">Z</text>
    <text x="198" y="128" font-family="cursive" font-size="22" font-weight="bold" fill="#2A2420">z</text>
    <text x="215" y="110" font-family="cursive" font-size="16" font-weight="bold" fill="#2A2420">z</text>
    <rect class="cup ink ink-main" x="292" y="425" width="28" height="34" rx="3"/>
    <g transform="translate(30, 275)">
      <ellipse class="wash" cx="170" cy="190" rx="100" ry="65"/>
      <ellipse class="ink ink-main" cx="170" cy="190" rx="100" ry="65"/>
      <ellipse class="wash" cx="108" cy="168" rx="50" ry="44"/>
      <ellipse class="ink ink-main" cx="108" cy="168" rx="50" ry="44"/>
      <path class="wash ink ink-main" d="M 262 188 C 312 182, 325 202, 308 222 C 292 232, 268 228, 258 208 Z"/>
      <path class="ink-thin" d="M 64 158 L 60 182"/>
