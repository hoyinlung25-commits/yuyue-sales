<?xml version="1.0" encoding="UTF-8"?>
<!-- Day 3: hugging knees, phone read receipt, rain outside window -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="1080" height="1350" role="img" aria-label="Axo Day 3 Seen Soul offline">
  <title>Axo Day 3 Seen</title>
  <defs>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.93  0 0 0 0 0.86  0 0 0 0.04 0" in="noise" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <style>
      .paper { fill: #F2EBD9; }
      .wash { fill: #E8D8E8; opacity: 0.55; }
      .gill-wash { fill: #D4C0E0; opacity: 0.45; }
      .ink { fill: none; stroke: #2A2420; stroke-linecap: round; stroke-linejoin: round; }
      .ink-main { stroke-width: 2.8; }
      .ink-light { stroke-width: 1.6; opacity: 0.9; }
      .eye { fill: #2A2420; }
      .window-glass { fill: #E4DDE8; opacity: 0.35; }
      .phone-screen { fill: #FAF6EE; }
      .rain { stroke: #6B7A8C; stroke-width: 1.4; opacity: 0.55; }
      .shadow { fill: #2A2420; opacity: 0.06; }
    </style>
  </defs>

  <g filter="url(#paperGrain)">
    <rect class="paper" width="400" height="640"/>

    <text x="200" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#2A2420">Seen. Soul offline.</text>

