      <line class="ink ink-light" x1="59" y1="4" x2="59" y2="94"/>
      <line class="ink ink-light" x1="4" y1="52" x2="114" y2="52"/>
      <line class="rain" x1="18" y1="8" x2="12" y2="28"/>
