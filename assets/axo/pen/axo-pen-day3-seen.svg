<?xml version="1.0" encoding="UTF-8"?>
<!-- Day 3: hugging knees, phone read receipt, rain outside window -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="1080" height="1350" role="img" aria-label="Axo Day 3 Seen Soul offline">
  <title>Axo Day 3 Seen</title>
  <defs>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.93  0 0 0 0 0.86  0 0 0 0.04 0" in="noise" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <style>
      .paper { fill: #F2EBD9; }
      .wash { fill: #E8D8E8; opacity: 0.55; }
      .gill-wash { fill: #D4C0E0; opacity: 0.45; }
      .ink { fill: none; stroke: #2A2420; stroke-linecap: round; stroke-linejoin: round; }
      .ink-main { stroke-width: 2.8; }
      .ink-light { stroke-width: 1.6; opacity: 0.9; }
      .eye { fill: #2A2420; }
      .window-glass { fill: #D8D0E0; opacity: 0.4; }
      .sky { fill: #C8D4E0; opacity: 0.5; }
      .phone-screen { fill: #FAF6EE; }
      .rain { stroke: #5A6A7C; stroke-width: 1.5; opacity: 0.6; }
      .shadow { fill: #2A2420; opacity: 0.06; }
    </style>
  </defs>

  <g filter="url(#paperGrain)">
    <rect class="paper" width="400" height="640"/>

    <text x="200" y="76" text-anchor="middle" font-family="cursive" font-size="26" font-weight="600" fill="#2A2420">Seen. Soul offline.</text>

    <!-- Window with rain outside -->
    <g transform="translate(232, 96)">
      <rect class="sky" x="4" y="4" width="126" height="108" rx="2"/>
      <line class="rain" x1="14" y1="6" x2="8" y2="30"/>
      <line class="rain" x1="34" y1="2" x2="28" y2="26"/>
      <line class="rain" x1="54" y1="8" x2="48" y2="32"/>
      <line class="rain" x1="74" y1="4" x2="68" y2="28"/>
      <line class="rain" x1="94" y1="10" x2="88" y2="34"/>
      <line class="rain" x1="114" y1="6" x2="108" y2="30"/>
      <line class="rain" x1="124" y1="14" x2="118" y2="38"/>
      <line class="rain" x1="24" y1="38" x2="18" y2="62"/>
      <line class="rain" x1="44" y1="34" x2="38" y2="58"/>
      <line class="rain" x1="64" y1="40" x2="58" y2="64"/>
      <line class="rain" x1="84" y1="36" x2="78" y2="60"/>
      <line class="rain" x1="104" y1="42" x2="98" y2="66"/>
      <line class="rain" x1="18" y1="70" x2="12" y2="94"/>
      <line class="rain" x1="48" y1="74" x2="42" y2="98"/>
      <line class="rain" x1="78" y1="68" x2="72" y2="92"/>
      <line class="rain" x1="108" y1="72" x2="102" y2="96"/>
      <line class="rain" x1="58" y1="88" x2="52" y2="108"/>
      <rect class="ink ink-main window-glass" x="0" y="0" width="134" height="112" rx="4" fill="none"/>
      <line class="ink ink-light" x1="67" y1="4" x2="67" y2="108"/>
      <line class="ink ink-light" x1="4" y1="58" x2="130" y2="58"/>
    </g>

    <ellipse class="shadow" cx="196" cy="552" rx="78" ry="14"/>

    <!-- Axo hugging knees, centered -->
    <g transform="translate(36, 268)">
      <!-- Knees / body bundle -->
      <ellipse class="wash" cx="164" cy="252" rx="96" ry="76"/>
      <ellipse class="ink ink-main" cx="164" cy="252" rx="96" ry="76"/>
      <!-- Knee bump (hugging knees) -->
      <ellipse class="wash" cx="164" cy="228" rx="52" ry="38"/>
      <ellipse class="ink ink-light" cx="164" cy="228" rx="52" ry="38"/>

      <!-- Head tilted down -->
      <ellipse class="wash" cx="164" cy="148" rx="80" ry="72"/>
      <ellipse class="ink ink-main" cx="164" cy="148" rx="80" ry="72"/>

      <!-- 6 gills drooping -->
      <path class="gill-wash ink ink-light" d="M 92 128 C 80 150, 76 172, 82 194"/>
      <path class="gill-wash ink ink-light" d="M 102 132 C 92 154, 88 176, 94 198"/>
      <path class="gill-wash ink ink-light" d="M 112 136 C 104 158, 100 180, 106 202"/>
      <path class="gill-wash ink ink-light" d="M 236 128 C 248 150, 252 172, 246 194"/>
      <path class="gill-wash ink ink-light" d="M 226 132 C 236 154, 240 176, 234 198"/>
      <path class="gill-wash ink ink-light" d="M 216 136 C 224 158, 228 180, 222 202"/>

      <!-- Arms wrapped around knees -->
      <path class="wash ink ink-main" d="M 96 218 C 78 238, 72 258, 86 276 C 100 288, 118 272, 128 248 L 136 228 Z"/>
      <path class="wash ink ink-main" d="M 232 218 C 250 238, 256 258, 242 276 C 228 288, 210 272, 200 248 L 192 228 Z"/>

      <!-- Feet tucked under -->
      <path class="wash ink ink-light" d="M 132 302 L 120 322 Q 116 330 124 332 Q 132 334 134 322 Z"/>
      <path class="wash ink ink-light" d="M 196 302 L 208 322 Q 212 330 204 332 Q 196 334 194 322 Z"/>

      <!-- Phone (?? added in PNG post-process) -->
      <g transform="translate(128, 188)">
        <rect class="phone-screen ink ink-main" x="0" y="0" width="64" height="96" rx="7"/>
        <rect x="8" y="12" width="48" height="64" rx="3" fill="#F2EBD9" stroke="#2A2420" stroke-width="1.2"/>
      </g>

      <!-- LOCKED FACE -->
      <circle class="eye" cx="148" cy="142" r="2.5"/>
      <circle class="eye" cx="180" cy="142" r="2.5"/>
      <path class="ink ink-main" stroke-width="1.8" d="M 158 158 L 170 158"/>
    </g>
  </g>
</svg>
