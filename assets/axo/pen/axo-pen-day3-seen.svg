      <line class="rain" x1="98" y1="12" x2="92" y2="32"/>
      <line class="rain" x1="108" y1="4" x2="102" y2="22"/>
      <line class="rain" x1="28" y1="36" x2="22" y2="56"/>
      <line class="rain" x1="48" y1="32" x2="42" y2="52"/>
      <line class="rain" x1="68" y1="38" x2="62" y2="58"/>
