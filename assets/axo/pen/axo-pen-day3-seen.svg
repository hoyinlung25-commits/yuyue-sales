<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="1080" height="1350" role="img" aria-label="Axo Day 3 Seen Soul offline">
  <title>Axo Day 3 Seen</title>
  <defs>
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.93  0 0 0 0 0.86  0 0 0 0.05 0" in="noise" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <style>
      .paper { fill: #F2EBD9; }
      .wash { fill: #E8D8E8; opacity: 0.55; }
      .gill-wash { fill: #D4C0E0; opacity: 0.45; }
      .ink { fill: none; stroke: #2A2420; stroke-linecap: round; stroke-linejoin: round; }
      .ink-main { stroke-width: 2.8; }
      .ink-light { stroke-width: 1.6; }
      .eye { fill: #2A2420; }
      .rain { stroke: #6B7A8C; stroke-width: 1.4; opacity: 0.55; }
      .shadow { fill: #2A2420; opacity: 0.05; }
    </style>
  </defs>

  <g filter="url(#paperGrain)">
    <rect class="paper" width="400" height="640"/>

    <text x="200" y="78" text-anchor="middle" font-family="cursive" font-size="27" font-weight="600" fill="#2A2420">Seen. Soul offline.</text>

    <!-- Rainy window -->
    <g transform="translate(238, 100)">
      <rect x="5" y="5" width="124" height="104" rx="2" fill="#C5D2E0" opacity="0.55"/>
      <line class="rain" x1="16" y1="4" x2="10" y2="28"/>
      <line class="rain" x1="36" y1="0" x2="30" y2="24"/>
      <line class="rain" x1="56" y1="6" x2="50" y2="30"/>
      <line class="rain" x1="76" y1="2" x2="70" y2="26"/>
      <line class="rain" x1="96" y1="8" x2="90" y2="32"/>
      <line class="rain" x1="116" y1="4" x2="110" y2="28"/>
      <line class="rain" x1="26" y1="36" x2="20" y2="60"/>
      <line class="rain" x1="46" y1="32" x2="40" y2="56"/>
      <line class="rain" x1="66" y1="38" x2="60" y2="62"/>
      <line class="rain" x1="86" y1="34" x2="80" y2="58"/>
      <line class="rain" x1="106" y1="40" x2="100" y2="64"/>
      <line class="rain" x1="20" y1="68" x2="14" y2="92"/>
      <line class="rain" x1="50" y1="72" x2="44" y2="96"/>
      <line class="rain" x1="80" y1="66" x2="74" y2="90"/>
      <line class="rain" x1="110" y1="70" x2="104" y2="94"/>
      <rect class="ink ink-main" x="0" y="0" width="134" height="114" rx="4" fill="none"/>
      <line class="ink ink-light" x1="67" y1="4" x2="67" y2="110"/>
      <line class="ink ink-light" x1="4" y1="58" x2="130" y2="58"/>
    </g>

    <ellipse class="shadow" cx="200" cy="558" rx="84" ry="12"/>

    <!-- Axo hugging knees -->
    <g transform="translate(48, 290)">
      <!-- Body / knees -->
      <ellipse class="wash" cx="152" cy="228" rx="92" ry="70"/>
      <ellipse class="ink ink-main" cx="152" cy="228" rx="92" ry="70"/>
      <ellipse class="wash" cx="152" cy="206" rx="48" ry="34"/>
      <ellipse class="ink ink-light" cx="152" cy="206" rx="48" ry="34"/>

      <!-- Head -->
      <ellipse class="wash" cx="152" cy="128" rx="76" ry="68"/>
      <ellipse class="ink ink-main" cx="152" cy="128" rx="76" ry="68"/>

      <!-- 6 gills drooping -->
      <path class="gill-wash ink ink-light" d="M 84 110 C 72 132, 68 154, 74 176"/>
      <path class="gill-wash ink ink-light" d="M 94 114 C 84 136, 80 158, 86 180"/>
      <path class="gill-wash ink ink-light" d="M 104 118 C 96 140, 92 162, 98 184"/>
      <path class="gill-wash ink ink-light" d="M 220 110 C 232 132, 236 154, 230 176"/>
      <path class="gill-wash ink ink-light" d="M 210 114 C 220 136, 224 158, 218 180"/>
      <path class="gill-wash ink ink-light" d="M 200 118 C 208 140, 212 162, 206 184"/>

      <!-- Arms around knees -->
      <path class="wash ink ink-main" d="M 88 200 C 70 220, 64 240, 78 256 C 92 268, 110 252, 120 228 L 128 208 Z"/>
      <path class="wash ink ink-main" d="M 216 200 C 234 220, 240 240, 226 256 C 212 268, 194 252, 184 228 L 176 208 Z"/>

      <!-- Feet -->
      <path class="wash ink ink-light" d="M 124 278 L 112 296 Q 108 304 116 306 Q 124 308 126 296 Z"/>
      <path class="wash ink ink-light" d="M 180 278 L 192 296 Q 196 304 188 306 Q 180 308 178 296 Z"/>

      <!-- Phone -->
      <g transform="translate(118, 168)">
        <rect x="0" y="0" width="68" height="100" rx="8" fill="#FAF6EE" stroke="#2A2420" stroke-width="2.8" stroke-linejoin="round"/>
        <rect x="10" y="14" width="48" height="66" rx="3" fill="#F2EBD9" stroke="#2A2420" stroke-width="1.4"/>
        <g id="read-label" transform="translate(34, 44)" text-anchor="middle"/>
      </g>

      <!-- Locked face -->
      <circle class="eye" cx="136" cy="122" r="2.5"/>
      <circle class="eye" cx="168" cy="122" r="2.5"/>
      <path class="ink ink-main" stroke-width="1.8" d="M 146 138 L 158 138"/>
    </g>
  </g>
</svg>
